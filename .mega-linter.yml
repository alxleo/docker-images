# Repo-specific MegaLinter overrides.
# Extends the coding-standards baseline (ENABLE_LINTERS allowlist, configs, plugins).
# Lists here REPLACE extended values (MegaLinter doesn't merge arrays),
# so include base values when overriding list keys.
EXTENDS:
  - https://raw.githubusercontent.com/alxleo/coding-standards/main/.mega-linter-default.yml

# Use repo's own ruff config
PYTHON_RUFF_CONFIG_FILE: ruff.toml

# This component uses MCP 2; preserve the baseline environment for the other images.
PYTHON_PYRIGHT_CONFIG_FILE: pyrightconfig.json
PYTHON_PYRIGHT_PRE_COMMANDS:
  - command: pip install uv==0.13.6 && uv sync --project mcp-search --frozen
    cwd: workspace

# Exclude git worktrees (agent sandboxes) and build artifacts
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .claude
  - megalinter-reports
  - __pycache__
  - .venv
  - .ruff_cache
  - .terraform
  - .terragrunt-cache
  - coverage
  - .nyc_output
  - .next
  - .nuxt

# Use native, path-scoped Trivy exceptions for upstream-pinned scanner dependencies.
REPOSITORY_TRIVY_CUSTOM_ARGUMENTS:
  - "--ignorefile"
  - ".trivyignore.yaml"

# dclint is for docker-compose files -- not applicable here. The baseline's
# ENABLE_LINTERS lists it and wins by default, so let DISABLE_LINTERS win
# (MegaLinter >= 10.2; see #124).
ENABLE_DISABLE_LINTERS_PRIORITY: DISABLE
DISABLE_LINTERS:
  - DOCKERFILE_DCLINT

# Semgrep arguments: must replicate base excludes since EXTENDS replaces arrays.
# Rules load from the image's /rules directory, so semgrep reports them as
# rules.<id>; --exclude-rule needs that full ID or it matches nothing.
REPOSITORY_SEMGREP_ARGUMENTS:
  - "--exclude-rule=rules.trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces"
  - "--exclude-rule=rules.trailofbits.generic.curl-unencrypted-url.curl-unencrypted-url"
  - "--exclude-rule=rules.trailofbits.generic.wget-unencrypted-url.wget-unencrypted-url"
  - "--exclude-rule=rules.trailofbits.generic.postgres-insecure-sslmode.postgres-insecure-sslmode"
  # container-user-root false-positives on --user 0 in CI test commands and this config file
  - "--exclude=*/.ci.json"
  - "--exclude=.mega-linter.yml"
