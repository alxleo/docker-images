version: 2

updates:
  # Keep GHA action versions current. "/" only scans .github/workflows;
  # the composite action needs its own directory entry.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-image
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7

  # Base-image tag bumps. Only FROMs that point at real upstream registries
  # can move on their own (windmill, dagu-ops ubuntu, golang builders) — the
  # ghcr.io/alxleo/base-images/* mirrors only ever hold tags that
  # scripts/mirror-base-images.sh pushes, so a new base minor still starts
  # with a mirror-list edit. mcp-images.json pins stay manual.
  - package-ecosystem: docker
    directories:
      - /caddy-cloudflare
      - /dagu-ops
      - /docs-hub
      - /mcp
      - /mcp-auth-proxy
      - /mcp-reddit
      - /pihole-exporter
      - /windmill-deploy-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
    cooldown:
      default-days: 7

  # Locked Python deps for the native MCP servers
  - package-ecosystem: uv
    directory: /mcp-reddit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7

  # docs-hub's npm graph is the largest dependency surface in the repo —
  # grouped monthly to cap noise; security updates still arrive immediately
  - package-ecosystem: npm
    directory: /docs-hub
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      docs-hub-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
