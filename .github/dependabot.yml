version: 2

# Renovate owns version updates; Dependabot retains security updates.
# Zero disables version PRs only; GitHub applies a separate security-update limit.
updates:
  # GitHub Actions security updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7

  # Container security updates; mirrored base tags stay with the mirror owner.
  - package-ecosystem: docker
    directories:
      - /arc-runner
      - /finrobot-mcp
      - /litellm
      - /mcp
      - /mcp-auth-proxy
      - /mcp-reddit
      - /openbb-mcp
      - /transmute
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "docker"
      include: "scope"
    cooldown:
      default-days: 7

  # Locked Python security updates for the native MCP servers.
  - package-ecosystem: uv
    directory: /mcp-reddit
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7
