version: 2

# Renovate owns version updates; Dependabot retains security updates.
updates:
  # GitHub Actions security updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7

  # Container security updates; mirrored base tags stay with the mirror owner.
  - package-ecosystem: docker
    directories:
      - /arc-runner
      - /caddy-cloudflare
      - /docs-hub
      - /mcp
      - /mcp-auth-proxy
      - /mcp-reddit
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "docker"
      include: "scope"
    cooldown:
      default-days: 7

  # Locked Python security updates for the native MCP servers.
  - package-ecosystem: uv
    directory: /mcp-reddit
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7

  # Docs Hub security updates.
  - package-ecosystem: npm
    directory: /docs-hub
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      docs-hub-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the Go rewrite) breaks @astrojs/check's peer range —
      # ERESOLVE in the grouped bump. Lift when the Astro toolchain supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
