# Shared inputs for the hosted pilot and native ARC timing.
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - ACTION_ZIZMOR
  - BASH_SHELLCHECK
  - DOCKERFILE_HADOLINT
  - PYTHON_RUFF
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_SEMGREP
  - REPOSITORY_TRIVY
  - YAML_YAMLLINT

NATIVE_LINTERS:
  - ACTION_ACTIONLINT
  - REPOSITORY_SEMGREP
NATIVE_ENV_ALLOWLIST:
  - SEMGREP_ENABLE_VERSION_CHECK
  - SEMGREP_SEND_METRICS
NATIVE_RESULTS_CACHE: false

VALIDATE_ALL_CODEBASE: true
FAIL_IF_MISSING_LINTER_IN_FLAVOR: true
APPLY_FIXES: none
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .stock-megalinter-policy
MARKDOWN_SUMMARY_REPORTER: true
SHOW_ELAPSED_TIME: true
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false

LINTER_RULES_PATH: .
ACTION_ACTIONLINT_CONFIG_FILE: .github/actionlint.yaml
ACTION_ZIZMOR_CONFIG_FILE: .zizmor.yml
ACTION_ZIZMOR_ARGUMENTS:
  - --offline
PYTHON_RUFF_CONFIG_FILE: ruff.toml
REPOSITORY_BETTERLEAKS_CONFIG_FILE: .gitleaks.toml
REPOSITORY_SEMGREP_RULESETS:
  - .stock-megalinter-policy/semgrep-rules
REPOSITORY_SEMGREP_ARGUMENTS:
  - --disable-version-check
  - --metrics=off
  - --exclude=*/.ci.json
  - --exclude=.mega-linter.yml
REPOSITORY_TRIVY_ARGUMENTS:
  - --ignorefile
  - .trivyignore.yaml
