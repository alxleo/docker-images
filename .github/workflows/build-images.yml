# Build custom Docker images and push to ghcr.io
#
# Triggers:
#   - Pull requests: build-only (no push) -- gates merge
#   - Push to main: build + push to ghcr.io as :latest
#   - Mirror refresh: successful "Mirror base images" run rebuilds + pushes all
#     images so base-layer CVE fixes propagate without manual dispatch
#   - Manual dispatch: build + push (all images)
#
# Bot PRs (Dependabot, etc): affected custom images are built and tested.
# The larger shared MCP and E2E matrices remain skipped until merge.
#
# Change detection: each image only builds when its own files change.
# This avoids pushing identical images that cause unnecessary pulls downstream.
#
# Security: Trivy vulnerability scanning runs on a weekly schedule
# (maintenance.yml), not inline. Gitleaks handles secret detection here.
#
# Auto-discovery: any directory with a Dockerfile + optional .ci.json is an image.
# discover-images.sh generates the matrix; individual image jobs are replaced by
# native architecture matrix jobs (custom-images). MCP images keep their own
# matrix pipeline.

name: Build Custom Images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Mirror base images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: alxleo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Discovery + change detection
  # ---------------------------------------------------------------------------
  discover:
    name: Discover images
    # A failed mirror refresh must not trigger a fleet-wide rebuild
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      changed: ${{ steps.changes.outputs.changed }}
      custom_changed: ${{ steps.changes.outputs.custom_changed }}
      ci_changed: ${{ steps.changes.outputs.ci_changed }}
      mcp_changed: ${{ steps.changes.outputs.mcp_changed }}
      e2e_changed: ${{ steps.changes.outputs.e2e_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover images
        id: matrix
        run: |
          result=$(bash scripts/discover-images.sh)
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      # On main pushes, diff against the head of the last SUCCESSFUL build run,
      # not event.before: rapid merges supersede queued runs in the concurrency
      # group (GitHub keeps only the newest pending run), and each cancelled
      # run's changes would otherwise never be built or pushed.
      - name: Resolve diff base
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          last_built=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          if [ -n "$last_built" ] && git cat-file -e "$last_built" 2>/dev/null; then
            echo "sha=${last_built}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${EVENT_BEFORE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed directories
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.base.outputs.sha }}
          FULL_MATRIX: ${{ steps.matrix.outputs.result }}
        run: |
          # workflow_run = post-mirror refresh: rebuild everything so base-layer
          # CVE fixes propagate (issue #168)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_run" ]; then
            {
              echo "matrix=${FULL_MATRIX}"
              echo "changed=[]"
              echo "custom_changed=true"
              echo "ci_changed=true"
              echo "mcp_changed=true"
              echo "e2e_changed=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get changed files between base and head
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! changed_files=$(git diff --name-only "$BASE_SHA" HEAD); then
              echo "::warning::Unable to diff $BASE_SHA; rebuilding every image"
              {
                echo "matrix=${FULL_MATRIX}"
                echo "changed=[]"
                echo "custom_changed=true"
                echo "ci_changed=true"
                echo "mcp_changed=true"
                echo "e2e_changed=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # First push or missing base — build everything
            {
              echo "matrix=${FULL_MATRIX}"
              echo "changed=[]"
              echo "custom_changed=true"
              echo "ci_changed=true"
              echo "mcp_changed=true"
              echo "e2e_changed=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build JSON array of changed top-level directories
          changed_dirs=$(echo "$changed_files" | cut -d/ -f1 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          changed_files_json=$(echo "$changed_files" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # CI infra changed if build action, discover script, or build workflow changed
          ci_changed="false"
          if grep -qE '^(\.github/actions/|scripts/(discover-images|select-custom-images|select-mcp-pipelines)\.sh|\.github/workflows/build-images\.yml)' <<<"$changed_files"; then
            ci_changed="true"
          fi
          include_watch_paths="false"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            include_watch_paths="true"
          fi
          custom_matrix=$(bash scripts/select-custom-images.sh \
            "$FULL_MATRIX" "$changed_files_json" "$ci_changed" "$include_watch_paths")
          custom_changed=$(jq -r 'length > 0' <<<"$custom_matrix")

          mcp_routing=$(bash scripts/select-mcp-pipelines.sh "$changed_files_json" "$ci_changed")
          mcp_changed=$(jq -r '.mcp' <<<"$mcp_routing")
          e2e_changed=$(jq -r '.e2e' <<<"$mcp_routing")

          {
            echo "matrix=${custom_matrix}"
            echo "changed=${changed_dirs}"
            echo "custom_changed=${custom_changed}"
            echo "ci_changed=${ci_changed}"
            echo "mcp_changed=${mcp_changed}"
            echo "e2e_changed=${e2e_changed}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Security scan (PRs only)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Gitleaks secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern 'gitleaks_*_linux_x64.tar.gz' --output - | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --redact

  # ---------------------------------------------------------------------------
  # Custom images — native architecture builds and test-gated publication
  #
  # Each selected image is expanded into one job per declared platform. PRs
  # load and test both native images. Trusted builds push each tested image by
  # digest, then publish the final tags only after every architecture succeeds.
  # The existing composite action remains available to its other callers; this
  # path avoids its test-build cache export so each image has one GHA export.
  # ---------------------------------------------------------------------------
  resolve-custom-matrix:
    name: Resolve native build matrix
    needs: [discover]
    if: needs.discover.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve versions and native runners
        id: matrix
        env:
          IMAGE_MATRIX: ${{ needs.discover.outputs.matrix }}
        run: |
          set -euo pipefail
          images='[]'
          builds='[]'

          while IFS= read -r image; do
            name=$(jq -r '.name' <<< "$image")
            base_tag=$(jq -r '.tag' <<< "$image")
            platforms=$(jq -r '.platforms' <<< "$image")
            version=''
            tag_name=''

            if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
              prefix="${name}/${base_tag}-build."
              latest=$(git tag -l "${prefix}*" --sort=-v:refname | head -1)
              if [[ -n "$latest" ]]; then
                next=$((10#${latest#"$prefix"} + 1))
              else
                next=1
              fi
              version="${base_tag}-build.${next}"
              tag_name="${name}/${version}"
            fi

            image_with_version=$(jq -c \
              --arg version "$version" \
              --arg tag_name "$tag_name" \
              '. + {version: $version, tag_name: $tag_name}' <<< "$image")
            images=$(jq -c --argjson image "$image_with_version" '. + [$image]' <<< "$images")

            while IFS= read -r platform; do
              [[ -n "$platform" ]] || continue
              case "$platform" in
                linux/amd64)
                  arch=amd64
                  runner=ubuntu-24.04
                  ;;
                linux/arm64)
                  arch=arm64
                  runner=ubuntu-24.04-arm
                  ;;
                *)
                  echo "Unsupported custom image platform: ${platform}" >&2
                  exit 1
                  ;;
              esac
              build=$(jq -c \
                --arg platform "$platform" \
                --arg arch "$arch" \
                --arg runner "$runner" \
                '. + {platform: $platform, arch: $arch, runner: $runner}' \
                <<< "$image_with_version")
              builds=$(jq -c --argjson build "$build" '. + [$build]' <<< "$builds")
            done < <(tr ',' '\n' <<< "$platforms")
          done < <(jq -c '.[]' <<< "$IMAGE_MATRIX")

          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "builds=${builds}" >> "$GITHUB_OUTPUT"

  custom-images:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    needs: [discover, resolve-custom-matrix]
    if: >-
      needs.discover.result == 'success' &&
      needs.resolve-custom-matrix.result == 'success' &&
      needs.discover.outputs.custom_changed == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write  # push tested per-architecture digests to GHCR
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-custom-matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=ghcr.io/alxleo/buildkit:v0.20.2
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Native runners remove the QEMU ARM compilation path. The trusted build
      # publishes only an untagged digest here; final tags wait for tests below.
      - name: Build native image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          # zizmor: ignore[template-injection] — values come from repository manifests
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0}-{1},mode=min', matrix.name, matrix.arch) || '' }}
          outputs: >-
            ${{ github.event_name != 'pull_request' &&
                format('type=image,name=ghcr.io/alxleo/{0},push-by-digest=true,name-canonical=true,push=true', matrix.name) || '' }}
          tags: >-
            ${{ github.event_name == 'pull_request' &&
                format('docker-images-test/{0}:{1}-{2}', matrix.name, matrix.arch, github.run_id) || '' }}
          # flate resolves through the GitHub API; only trusted non-PR runner
          # builds receive the workflow token, never fork pull requests.
          secrets: >-
            ${{ github.event_name != 'pull_request' &&
                matrix.name == 'gitea-ci-runner' &&
                format('GITHUB_TOKEN={0}', secrets.GITHUB_TOKEN) || '' }}

      - name: Prepare image for tests
        id: image
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_ARCH: ${{ matrix.arch }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="docker-images-test/${IMAGE_NAME}:${IMAGE_ARCH}-${GITHUB_RUN_ID}"
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            test -n "${BUILD_DIGEST}"
            source_ref="${REGISTRY}/${OWNER}/${IMAGE_NAME}@${BUILD_DIGEST}"
            docker pull "$source_ref"
            docker tag "$source_ref" "$image_ref"
          fi
          echo "image-ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Test setup
        if: matrix.test_setup != ''
        env:
          TEST_SETUP: ${{ matrix.test_setup }}
        run: bash -c "$TEST_SETUP"

      - name: Run tests
        if: toJson(matrix.test_commands) != '[]'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ${{ steps.image.outputs.image-ref }}
          TEST_COMMANDS: ${{ toJson(matrix.test_commands) }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cmds < <(echo "$TEST_COMMANDS" | jq -r '.[]')
          for cmd in "${cmds[@]}"; do
            echo "::group::${cmd}"
            bash -c "$cmd"
            echo "::endgroup::"
          done

      - name: Save published digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$BUILD_DIGEST" > "digest-${IMAGE_ARCH}"

      - name: Upload published digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-image-digest-${{ matrix.name }}-${{ matrix.arch }}-${{ github.run_id }}
          path: digest-${{ matrix.arch }}
          if-no-files-found: error

  publish-custom-images:
    name: Publish ${{ matrix.name }}
    needs: [discover, resolve-custom-matrix, custom-images]
    if: >-
      github.event_name != 'pull_request' &&
      needs.discover.result == 'success' &&
      needs.resolve-custom-matrix.result == 'success' &&
      needs.custom-images.result == 'success' &&
      needs.discover.outputs.custom_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # push the per-image build version tag
      packages: write  # publish the tested manifest and final tags to GHCR
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-custom-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=ghcr.io/alxleo/buildkit:v0.20.2
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: custom-image-digest-${{ matrix.name }}-*-${{ github.run_id }}
          path: ${{ runner.temp }}/custom-image-digests
          merge-multiple: true

      - name: Merge tested digests and advance tags
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
          IMAGE_PLATFORMS: ${{ matrix.platforms }}
          IMAGE_VERSION: ${{ matrix.version }}
          TAG_NAME: ${{ matrix.tag_name }}
          DIGEST_DIR: ${{ runner.temp }}/custom-image-digests
        run: |
          set -euo pipefail
          image="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          sources=()
          for arch in amd64 arm64; do
            digest_file="${DIGEST_DIR}/digest-${arch}"
            if [[ "$arch" == 'arm64' && "$IMAGE_PLATFORMS" != *'linux/arm64'* ]]; then
              continue
            fi
            test -s "$digest_file"
            digest=$(<"$digest_file")
            sources+=("${image}@${digest}")
          done
          test "${#sources[@]}" -gt 0

          create_args=(
            --metadata-file "${RUNNER_TEMP}/${IMAGE_NAME}-index.json"
            --tag "${image}:${IMAGE_TAG}"
            --tag "${image}:latest"
          )
          if [[ -n "$IMAGE_VERSION" ]]; then
            create_args+=(--tag "${image}:${IMAGE_VERSION}")
          fi
          if [[ "${#sources[@]}" -eq 1 ]]; then
            create_args+=(--prefer-index=false)
          fi
          docker buildx imagetools create "${create_args[@]}" "${sources[@]}"
          cat "${RUNNER_TEMP}/${IMAGE_NAME}-index.json"

          # The version was reserved once for the image before either native
          # build started, and is tagged only after all tested digests merged.
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

  # ---------------------------------------------------------------------------
  # MCP images — separate pipeline (own matrix, smoke tests, E2E)
  # ---------------------------------------------------------------------------
  load-mcp-matrix:
    name: Load MCP build matrix
    needs: discover
    if: >-
      always() &&
      (needs.discover.outputs.mcp_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - id: set-matrix
        run: echo "matrix=$(cat mcp-images.json | jq -c '.')" >> "$GITHUB_OUTPUT"

  mcp-images:
    name: MCP ${{ matrix.name }}
    needs: load-mcp-matrix
    if: >-
      always() &&
      needs.load-mcp-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-mcp-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup QEMU (cross-platform)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64
      - name: Setup buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=ghcr.io/alxleo/buildkit:v0.20.2
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PRs: build amd64, load it, then run image and MCP protocol contracts.
      # Push: multi-platform build + push
      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mcp
          file: mcp/${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=mcp-${{ matrix.name }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope=mcp-{0},mode=min', matrix.name) || '' }}
          tags: |
            ghcr.io/alxleo/${{ matrix.name }}:${{ matrix.tag }}
            ghcr.io/alxleo/${{ matrix.name }}:latest
      - name: Run image contract tests
        if: >-
          github.event_name == 'pull_request' &&
          toJson(matrix.test_commands) != 'null' &&
          toJson(matrix.test_commands) != '[]'
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ghcr.io/alxleo/${{ matrix.name }}:${{ matrix.tag }}
          TEST_COMMANDS: ${{ toJson(matrix.test_commands) }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cmds < <(jq -r '.[]' <<< "$TEST_COMMANDS")
          for cmd in "${cmds[@]}"; do
            echo "::group::${cmd}"
            bash -euo pipefail -c "$cmd"
            echo "::endgroup::"
          done
      - name: Run MCP protocol smoke
        if: >-
          github.event_name == 'pull_request' &&
          (
            toJson(matrix.secrets) == 'null' ||
            toJson(matrix.secrets) == '[]' ||
            (
              toJson(matrix.smoke_env) != 'null' &&
              toJson(matrix.smoke_env) != '[]'
            )
          )
        env:
          CONTRACT: ${{ matrix.contract }}
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ghcr.io/alxleo/${{ matrix.name }}:${{ matrix.tag }}
          SMOKE_ENV: ${{ toJson(matrix.smoke_env) }}
        shell: bash
        run: |
          set -euo pipefail
          contract_args=()
          if [ -n "${CONTRACT:-}" ]; then
            contract_args=(--contract "$CONTRACT")
          fi
          mapfile -t smoke_env < <(jq -r '.[]?' <<< "${SMOKE_ENV:-null}")
          bash test/run-mcp-image-smoke.sh \
            "$IMAGE_NAME" "$IMAGE_REF" 18080 \
            "${contract_args[@]}" "${smoke_env[@]}"

  # Smoke test: validates entrypoint.py -> mcp-proxy -> MCP server chain
  # Runs 2 canary images (1 npm, 1 Python) through the full MCP handshake.
  # No API keys needed — initialize and tools/list work without auth.
  mcp-smoke-test:
    name: MCP smoke (${{ matrix.name }})
    needs: [discover, load-mcp-matrix, mcp-images]
    if: >-
      always() &&
      needs.mcp-images.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test-only canary for the shared npm proxy/filter layer. This image
          # is intentionally absent from mcp-images.json and is never pushed.
          - name: mcp-hackernews
            dockerfile: Dockerfile.npm
            build_args: "MCP_PACKAGE=mcp-hacker-news@1.0.3"
          - name: mcp-arxiv
            dockerfile: Dockerfile.arxiv
            build_args: "ARXIV_MCP_VERSION=0.6.1\nMCP_PROXY_VERSION=6.5.4\nUV_VERSION=0.12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mcp
          file: mcp/${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: false
          load: true
          tags: test-${{ matrix.name }}:latest
      - name: Verify arXiv runtime
        if: matrix.name == 'mcp-arxiv'
        run: |
          docker run --rm --entrypoint sh test-mcp-arxiv:latest -c \
            "python3 --version | grep -F 'Python 3.14.' &&
             node --version | grep -E '^v26\\.' &&
             python3 -c 'from importlib.metadata import version; assert version(\"arxiv-mcp-server\") == \"0.6.1\"; assert version(\"mcp\").startswith(\"1.\"); import pymupdf4llm'"
      - name: Start container
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          docker run -d --name "${IMAGE_NAME}" \
            -e MCP_STARTUP_JITTER=0 \
            -p 8080:8080 \
            "test-${IMAGE_NAME}:latest"
      - name: Run smoke tests
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: bash test/test-mcp-smoke.sh "${IMAGE_NAME}" 8080
      - name: Dump smoke logs on failure
        if: failure()
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: docker logs "${IMAGE_NAME}" 2>&1 | tail -100
      - name: Cleanup smoke container
        if: always()
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: docker rm -f "${IMAGE_NAME}" || true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
        if: matrix.name == 'mcp-hackernews'
      - name: Tool filtering + secret tests
        if: matrix.name == 'mcp-hackernews'
        env:
          TEST_MCP_IMAGE: test-${{ matrix.name }}:latest
        run: uv run --with pytest --with requests -- python -m pytest test/test_tool_filtering.py -v --tb=short
      - name: Dump remaining container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter "name=test-"); do
            echo "=== $(docker inspect --format '{{.Name}}' "$c") ==="
            docker logs "$c" 2>&1 | tail -50
          done

  # E2E stack test: full Caddy -> mcp-proxy -> MCP server contract validation
  # Spins up Caddy + both test-only canaries (npm: hackernews, Python: arxiv).
  # Tests: health endpoint contract (/ping), prefix stripping, MCP protocol
  # handshake, session headers, TLS with internal certs, service discovery.
  # This is the contract test that downstream repos (homelab) depend on.
  mcp-e2e-test:
    name: MCP E2E stack test
    needs: discover
    if: >-
      always() &&
      (needs.discover.outputs.e2e_changed == 'true'
       || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Unit tests (no Docker)
        run: uv run --with pytest --with pyyaml --with requests -- python -m pytest test/test_manifests.py test/test_entrypoint.py -v
      - name: Validate MCP E2E Caddyfile
        run: |
          docker run --rm -v "${{ github.workspace }}/test:/test" \
            caddy:2.11 \
            caddy validate --config /test/Caddyfile.mcp-e2e --adapter caddyfile
      - name: Run E2E stack tests
        run: uv run --with pytest --with pyyaml --with requests -- python -m pytest test/test_mcp_stack.py -v --tb=short
      - name: Dump logs on failure
        if: failure()
        run: |
          cd test
          docker compose -f docker-compose.mcp-e2e.yml logs
      - name: Cleanup
        if: always()
        run: |
          cd test
          docker compose -f docker-compose.mcp-e2e.yml down -v
