# Mirror Docker Hub base images to GHCR weekly.
#
# Keeps GHCR mirrors fresh with upstream security patches.
# If images haven't changed upstream, this is a fast no-op.
# Manual trigger available for immediate updates after version bumps.

name: Mirror base images

on:
  schedule:
    - cron: '23 3 * * 1'  # Monday 3:23 AM UTC
  workflow_dispatch:
    inputs:
      image:
        description: 'Optional single image to mirror (for example ubuntu:24.04)'
        required: false
        default: ''
        type: string

permissions:
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror base images
        run: bash scripts/mirror-base-images.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MIRROR_IMAGE: ${{ inputs.image }}
