# Mirror Docker Hub base images to GHCR weekly.
#
# Keeps GHCR mirrors fresh with upstream security patches.
# If images haven't changed upstream, this is a fast no-op.
# Manual trigger available for immediate updates after version bumps.
#
# Requires GHCR_PAT secret: a classic PAT with read:packages + write:packages scope.
# GITHUB_TOKEN cannot write to these packages because they were created via a local
# PAT push and are not auto-linked to this repository. See GHCR access control docs:
# https://docs.github.com/en/packages/learn-github-packages/configuring-a-packages-access-control-and-visibility

name: Mirror base images

on:
  schedule:
    - cron: '23 3 * * 1'  # Monday 3:23 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: alxleo
          password: ${{ secrets.GHCR_PAT }} # zizmor: ignore[secrets-outside-env]
      - name: Mirror base images
        run: bash scripts/mirror-base-images.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }} # zizmor: ignore[secrets-outside-env]
          GITHUB_ACTOR: alxleo
