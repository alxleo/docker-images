# Shared workflow check. Renovate updates local pins.
name: Workflow Check

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - name: Detect Markdown-only changes
        id: markdown-scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --name-only --no-renames HEAD^1 HEAD -- . ':(exclude,icase,glob)**/*.md' | awk 'END { print "markdown_only=" (NR == 0) }' >> "$GITHUB_OUTPUT"
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        name: Audit GitHub Actions security
        uses: docker://ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
        with:
          args: >-
            --offline --format=github --min-severity=medium --strict-collection
            --collect workflows actions -- .
