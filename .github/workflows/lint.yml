# Lint via coding-standards (MegaLinter) + repo-specific checks
#
# coding-standards auto-detects and runs: hadolint, shellcheck, yamllint,
# actionlint, zizmor, ruff, lychee, gitleaks, semgrep, and more.
# Repo-specific jobs: pytest (manifests, entrypoint, contracts, fleet), conftest.

name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coding-standards:
    name: coding-standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: alxleo/coding-standards/docker-action@64ee4766d68ff95fb13467376368d05a80c0283a # main

  stock-megalinter:
    name: Stock MegaLinter (pilot)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out shared lint rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alxleo/coding-standards
          ref: 671b81a7d297fc81b56962b294ada8eb3f2587cd
          path: .stock-megalinter-policy
          sparse-checkout: |
            semgrep-rules
            lint-configs
          persist-credentials: false
      - name: Run stock MegaLinter
        id: stock
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/python@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        env:
          MEGALINTER_CONFIG: .github/stock-megalinter.yml
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
      - name: Scan Git history with Betterleaks
        id: history
        continue-on-error: true
        uses: docker://ghcr.io/betterleaks/betterleaks:v1.7.3@sha256:4522fe41a2d22f9bf9b4100c20488b79a5af5c37abc8f3d0cdccdcc47dac3523
        env:
          # Git sees the runner-owned workspace from inside the stock container.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose --config .gitleaks.toml .
      - name: Record advisory results
        if: always()
        env:
          STOCK_OUTCOME: ${{ steps.stock.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: |
          {
            printf 'Stock MegaLinter outcome (advisory) %s\n\n' "$STOCK_OUTCOME"
            printf 'Betterleaks Git-history outcome (advisory) %s\n' "$HISTORY_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install pytest pyyaml requests
      # Same suite as `just check` so local and CI verification agree
      - run: >-
          pytest -x
          test/test_manifests.py
          test/test_entrypoint.py
          test/test_mcp_contract.py
          test/test_toolhive_fleet.py
          test/test_check_user_has_group.py

  conftest:
    name: conftest (Dockerfile + Compose policies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install conftest
        run: |
          CONFTEST_VERSION=0.71.1
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest
      - name: OPA unit tests
        run: conftest verify -p policy/
      - name: Test Dockerfile policies
        run: conftest test --parser dockerfile -p policy/ -- */Dockerfile mcp/Dockerfile.*
      - name: Test Compose policies
        run: conftest test --parser yaml -p policy/ -- test/docker-compose*.yml examples/docker-compose.yml
