# Lint via coding-standards (MegaLinter) + repo-specific checks
#
# coding-standards auto-detects and runs: hadolint, shellcheck, yamllint,
# actionlint, zizmor, ruff, lychee, gitleaks, semgrep, and more.
# Repo-specific jobs: pytest (manifests, entrypoint, contracts, fleet), conftest.

name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coding-standards:
    name: coding-standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: alxleo/coding-standards/docker-action@main

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pytest pyyaml requests
      # Same suite as `just check` so local and CI verification agree
      - run: >-
          pytest -x
          test/test_manifests.py
          test/test_entrypoint.py
          "test/test_custom_images.py::TestImageReferenceResolution"
          test/test_mcp_contract.py
          test/test_toolhive_fleet.py

  conftest:
    name: conftest (Dockerfile + Compose policies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install conftest
        run: |
          CONFTEST_VERSION=0.68.2
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest
      - name: OPA unit tests
        run: conftest verify -p policy/
      - name: Test Dockerfile policies
        run: conftest test --parser dockerfile -p policy/ -- */Dockerfile mcp/Dockerfile.*
      - name: Test Compose policies
        run: conftest test --parser yaml -p policy/ -- test/docker-compose*.yml examples/docker-compose.yml
