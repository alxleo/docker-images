name: Build GARM NixOS image

on:
  pull_request:
    paths:
      - garm-runner-image/**
      - .github/workflows/build-garm-runner-image.yml
  push:
    branches: [main]
    paths:
      - garm-runner-image/**
      - .github/workflows/build-garm-runner-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build NixOS Incus image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build image assets
        run: |
          set -euo pipefail
          nix build --accept-flake-config --print-build-logs \
            ./garm-runner-image#garm-runner-qcow2 -o result-qcow2
          nix build --accept-flake-config --print-build-logs \
            ./garm-runner-image#garm-runner-metadata -o result-metadata
          mkdir -p dist
          cp result-qcow2/nixos.qcow2 dist/garm-runner-x86_64.qcow2
          cp result-metadata/tarball/*.tar.xz dist/garm-runner-x86_64-metadata.tar.xz
      - name: Upload build assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garm-runner-image-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish immutable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: garm-runner-image-${{ github.sha }}
          path: dist
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: garm-runner-${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Immutable NixOS Incus VM image for commit $GITHUB_SHA." \
            --latest=false \
            dist/garm-runner-x86_64-metadata.tar.xz \
            dist/garm-runner-x86_64.qcow2
