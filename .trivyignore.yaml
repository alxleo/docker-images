# Version-scoped native dependency exceptions; a Semgrep version change expires them.
# Keep the upstream pins and scan all other packages and paths.
vulnerabilities:
  - id: CVE-2026-116684
    paths:
      - gitea-ci-runner/.mise/locks/semgrep/1.184.0~7877237f/uv.lock
    statement: >-
