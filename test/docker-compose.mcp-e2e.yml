services:
  caddy:
    build: ../caddy-cloudflare
    ports:
      - "127.0.0.1:${MCP_E2E_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${MCP_E2E_HTTPS_PORT:-8443}:443"
      - "127.0.0.1:${MCP_E2E_ADMIN_PORT:-2019}:2019"
    volumes:
      - ./Caddyfile.mcp-e2e:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      mcp-hackernews:
        condition: service_started
      mcp-arxiv:
        condition: service_started

  # npm-based canary
  mcp-hackernews:
    build:
      context: ../mcp
      dockerfile: Dockerfile.npm
      args:
        MCP_PACKAGE: mcp-hacker-news@1.0.3
    environment:
      MCP_STARTUP_JITTER: "0"

  # Python-based canary
  mcp-arxiv:
    build:
      context: ../mcp
      dockerfile: Dockerfile.arxiv
      args:
        ARXIV_MCP_VERSION: 0.6.1
        MCP_PROXY_VERSION: 6.5.4
        UV_VERSION: 0.12.0
    environment:
      MCP_STARTUP_JITTER: "0"

volumes:
  caddy-data:
