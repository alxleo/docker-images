services:
  caddy:
    image: docker.io/library/caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    ports:
      - "127.0.0.1:${MCP_E2E_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${MCP_E2E_HTTPS_PORT:-8443}:443"
      - "127.0.0.1:${MCP_E2E_ADMIN_PORT:-2019}:2019"
    volumes:
      - ./Caddyfile.mcp-e2e:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      mcp-hackernews:
        condition: service_started

  # Test-only npm canary; this wrapper is not part of the published image fleet.
  mcp-hackernews:
    build:
      context: ../mcp
      dockerfile: Dockerfile.npm
      args:
        MCP_PACKAGE: mcp-hacker-news@1.0.3
    environment:
      MCP_STARTUP_JITTER: "0"

volumes:
  caddy-data:
