# Prepared tool baseline. Repository pins may install newer versions into
# their own writable mise directory while reusing these read-only installs.
#
# Exact versions only: mise's lookup of a partial version would move the
# image between rebuilds.
min_version = "2026.10.23"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64"]
npm.package_manager = "aube"

# PyPI environments keep this lockfile's Python when a project changes its own.
[tools]
# Two Python and Node lines: the repository's (3.13, 24) and the newest
# supported ones (3.14, 26), exposed as python3.13/python3.14 and node24/node26.
python = ["3.13.18", "3.14.10"]
node = ["24.22.2", "26.13.0"]
# The Dockerfile replaces mise's bun with the digest-pinned upstream binary and
# fails the build if its version differs from this pin.
bun = "1.4.4"
uv = "0.13.6"
just = "1.59.0"
bats = "1.13.0"
chezmoi = "2.70.3"

pre-commit = "4.7.0"
ruff = "0.17.3"
semgrep = { version = "1.183.0", python = "3.13" }
shellcheck = "0.11.0"
shfmt = "3.14.1"
yamllint = { version = "1.38.0", python = "3.13" }
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
hadolint = "2.15.1"
trivy = "0.76.1"
conftest = "0.71.0"
cue = "0.17.1"
d2 = "0.9.0"
jq = "1.8.2"
yq = "4.54.1"
lychee = "0.24.2"
"pipx:ansible-core" = { version = "2.21.5", python = "3.13" }
"npm:actions-up" = "2.0.0"
"npm:json-schema-to-typescript" = "16.0.0"
"npm:dependency-cruiser" = "18.7.1"
"npm:@axe-core/cli" = "4.14.0"
"npm:jscpd" = "5.4.2"

opentofu = "1.13.1"
helm = "4.3.1"
kubectl = "1.37.2"
flux2 = "2.10.0"
talosctl = "1.14.5"
cilium-hubble = "1.20.2"
"npm:@mcpjam/cli" = { version = "6.0.1", depends = ["node"] }
terraform-docs = "0.24.0"
tflint = "0.65.0"
sops = "3.13.3"
age = "1.3.2"
openbao = "2.7.2"
caddy = "2.11.7"
cloudflared = "2026.10.7"
restic = "0.19.1"
gh = "2.103.3"
kyverno = "1.19.2"
kube-linter = "0.8.3"
pluto = "5.24.4"
"github:home-operations/flate" = "0.6.5"
"github:fluxcd/flux-schema" = "0.17.0"

[tool_alias]
openobserve-cli = "http:openobserve-cli"
flux-operator-mcp = "http:flux-operator-mcp"

[tools."github:kubernetes-sigs/kwok"]
version = "0.8.0"
bin = "kwokctl"

[tools."github:kubernetes-sigs/kwok".platforms]
macos-arm64 = { asset_pattern = "kwokctl-darwin-arm64" }
linux-x64 = { asset_pattern = "kwokctl-linux-amd64" }
linux-arm64 = { asset_pattern = "kwokctl-linux-arm64" }

[tools.openobserve-cli]
version = "0.18.0"
bin = "openobserve-cli"

[tools.openobserve-cli.platforms]
macos-arm64 = { url = "https://github.com/AngelMsger/openobserve-cli/releases/download/v0.18.0/openobserve-cli-darwin-arm64", checksum = "sha256:10baff2c22594dbc2927bc4bbbf9b4571824a3ea66694a3cf156d0cccbe0940d" }
linux-x64 = { url = "https://github.com/AngelMsger/openobserve-cli/releases/download/v0.18.0/openobserve-cli-linux-amd64", checksum = "sha256:8937e3662c563fa9f7454e5859b636633d2defa7fa7cffc894fc11e173bfe1a1" }
linux-arm64 = { url = "https://github.com/AngelMsger/openobserve-cli/releases/download/v0.18.0/openobserve-cli-linux-arm64", checksum = "sha256:78a50e50beb94cec7638bddda2b4987303cd2186a5bddf350d88bfe11b01c7cf" }

[tools.flux-operator-mcp]
version = "0.62.1"
