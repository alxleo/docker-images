rules:
  # Weekly Dependabot updates are acceptable for a small personal repo.
  # The "insufficient cooldown" rule is designed for orgs where rapid
  # Dependabot PRs could be a supply chain attack vector.
  dependabot-cooldown:
    ignore:
      - dependabot.yml
  # coding-standards action is our own image -- always track @main for latest linters.
  unpinned-uses:
    ignore:
      - lint.yml
  # workflow_run on build-images.yml only fires from "Mirror base images" runs
  # on main (branches: [main] filter) -- same-repo scheduled workflow, no
  # untrusted code path. It exists so base-mirror refreshes rebuild images
  # (issue #168).
  dangerous-triggers:
    ignore:
      - build-images.yml
